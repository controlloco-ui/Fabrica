<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a1b">
<title>Fábrica Tycoon</title>
<style>
  :root { --panel:rgba(15,20,28,.86); --card:#1d2530; --line:#34404f; --text:#fff; --dim:#aab4c3;
    --gold:#ffd84a; --green:#2fae4a; --red:#d13b3b; --blue:#3a7bd5; --pink:#e94fd0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16202a; color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; }
  input[type=text] { user-select:text; -webkit-user-select:text; }
  canvas#gl, canvas#c { position:fixed; left:0; top:0; display:block; width:100vw; height:100vh; height:100dvh; }
  .hidden { display:none !important; }
  button { font-family:inherit; cursor:pointer; }

  #hud { position:fixed; inset:0; pointer-events:none; }
  #tl { position:absolute; left:10px; top:calc(env(safe-area-inset-top) + 8px); display:flex; flex-direction:column; gap:6px; max-width:62vw; }
  #cashBox { background:var(--panel); border-radius:14px; padding:7px 12px 8px; box-shadow:0 3px 0 rgba(0,0,0,.3); min-width:160px; pointer-events:auto; }
  #cash { font-size:25px; font-weight:900; color:var(--gold); text-shadow:0 2px 0 rgba(0,0,0,.4); line-height:1.1; }
  #ips { font-size:12.5px; color:#9f9; font-weight:700; }
  #lvlRow { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12px; font-weight:800; }
  #lvlBar { flex:1; height:7px; background:#0c1016; border-radius:4px; overflow:hidden; min-width:60px; }
  #lvlFill { height:100%; width:0; background:linear-gradient(90deg,#5ad1ff,#a36bff); }
  #tok { font-size:11.5px; color:#f9c; font-weight:800; }
  #miss { background:var(--panel); border-radius:12px; padding:5px 9px; font-size:11px; pointer-events:auto; max-width:200px; }
  #miss .m { margin:3px 0; }
  #miss .bar { height:4px; background:#0c1016; border-radius:3px; overflow:hidden; margin-top:2px; }
  #miss .bar i { display:block; height:100%; background:var(--green); }
  #miss.min .m { display:none; }
  #missHead { font-weight:900; color:var(--gold); display:flex; justify-content:space-between; gap:10px; }
  #tr { position:absolute; right:10px; top:calc(env(safe-area-inset-top) + 8px); display:flex; flex-direction:column; gap:6px; pointer-events:auto; }
  .hb { width:44px; height:44px; border-radius:13px; border:none; background:var(--panel); color:#fff; font-size:20px; font-weight:900;
    box-shadow:0 3px 0 rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; }
  .hb:active { transform:translateY(2px); box-shadow:none; }
  #br { position:absolute; right:12px; bottom:calc(env(safe-area-inset-bottom) + 14px); display:flex; align-items:flex-end; gap:8px; pointer-events:auto; }
  #brCol { display:flex; flex-direction:column; gap:6px; }
  #dash { width:78px; height:78px; border-radius:50%; border:3px solid rgba(255,255,255,.5); color:#fff; font-size:30px;
    background:radial-gradient(circle at 35% 30%, #ffe36b, #ff8a00); box-shadow:0 4px 0 rgba(0,0,0,.35); position:relative; }
  #dash:active { transform:scale(.94); }
  #dash .cd { position:absolute; inset:-3px; border-radius:50%; pointer-events:none; }
  #dash small { position:absolute; bottom:-16px; left:0; right:0; font-size:10px; font-weight:900; text-shadow:0 1px 2px #000; }
  #banner { position:absolute; top:calc(env(safe-area-inset-top) + 64px); left:50%; transform:translateX(-50%); padding:8px 16px; border-radius:14px;
    font-weight:900; background:linear-gradient(90deg,#ffb800,#ff6a00); box-shadow:0 3px 0 rgba(0,0,0,.35); white-space:nowrap; font-size:14px; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 110px); transform:translateX(-50%);
    background:var(--panel); padding:10px 16px; border-radius:12px; font-weight:800; opacity:0; transition:opacity .3s;
    pointer-events:none; text-align:center; max-width:88vw; z-index:30; }
  #toast.show { opacity:1; }
  #decorBar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:6;
    background:var(--panel); border-radius:16px; padding:8px; display:flex; gap:6px; align-items:center; box-shadow:0 4px 0 rgba(0,0,0,.35); max-width:98vw; flex-wrap:nowrap; justify-content:center; }
  #decorBar .hb { width:44px; height:44px; flex:none; }
  #decorBar .lbl { font-size:11px; font-weight:800; color:#cfe; width:84px; text-align:center; line-height:1.2; }
  #decorBar .hb.ok { background:var(--green); }
  #decorBar .hb.danger { background:var(--red); }
  #decorBar .hb:disabled { opacity:.35; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:12px; z-index:10; }
  .sheet { background:var(--card); border-radius:18px; width:100%; max-width:560px; max-height:calc(100dvh - 24px); display:flex; flex-direction:column;
    border:2px solid var(--line); box-shadow:0 8px 0 rgba(0,0,0,.35); overflow:hidden; }
  .sheet header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px; gap:8px; }
  .sheet header h2 { margin:0; font-size:20px; color:var(--gold); }
  .sheet header .money { font-weight:900; color:var(--gold); font-size:14px; margin-left:auto; margin-right:8px; }
  .x { width:38px; height:38px; border-radius:11px; border:none; background:#3a4656; color:#fff; font-size:18px; font-weight:900; flex:none; }
  .tabs { display:flex; gap:6px; padding:0 12px 8px; overflow-x:auto; flex:none; touch-action:pan-x; }
  .tabs button { flex:none; padding:8px 12px; border-radius:10px; border:none; background:#2a3442; color:#cfd7e3; font-weight:800; font-size:13px; }
  .tabs button.on { background:var(--blue); color:#fff; }
  .body { overflow-y:auto; padding:4px 14px 16px; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  .body h3 { margin:14px 0 6px; font-size:14px; color:#cfe; text-transform:uppercase; letter-spacing:.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:8px; }
  .chip { position:relative; border:2px solid transparent; background:#2a3442; color:#fff; border-radius:12px; padding:8px 6px; font-weight:800; font-size:12.5px;
    display:flex; flex-direction:column; align-items:center; gap:3px; min-height:58px; justify-content:center; text-align:center; }
  .chip .ic { font-size:22px; line-height:1; }
  .chip small { font-size:11px; color:var(--gold); font-weight:800; }
  .chip.sel { border-color:var(--gold); background:#3a3420; }
  .chip.locked { opacity:.55; }
  .chip.locked small { color:#ff9a9a; }
  .chip .sw { width:100%; height:34px; border-radius:8px; border:1px solid rgba(255,255,255,.2); }
  .chip canvas { width:84px; height:64px; }
  .swatches { display:flex; flex-wrap:wrap; gap:7px; }
  .swatches button { width:32px; height:32px; border-radius:50%; border:3px solid rgba(255,255,255,.15); }
  .swatches button.sel { border-color:#fff; transform:scale(1.1); }
  .slider { display:grid; grid-template-columns:110px 1fr 36px; align-items:center; gap:8px; margin:7px 0; font-size:13.5px; font-weight:700; }
  .slider span:last-child { text-align:right; color:var(--dim); font-size:12px; }
  input[type=range] { width:100%; accent-color:#ffb800; height:26px; touch-action:pan-x; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #2c3644; font-size:14px; gap:10px; }
  .row b { color:var(--gold); }
  .btn { padding:11px 14px; border:none; border-radius:12px; font-size:15px; font-weight:900; color:#fff; background:var(--blue); box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .btn:active { transform:translateY(2px); box-shadow:none; }
  .btn.ok { background:var(--green); } .btn.danger { background:var(--red); } .btn.ghost { background:#3a4656; } .btn.pink { background:var(--pink); }
  .btn:disabled { background:#3a4656; color:#8a95a5; box-shadow:none; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1; padding:9px; border-radius:10px; border:2px solid transparent; background:#2a3442; color:#fff; font-weight:800; min-width:72px; }
  .seg button.on { border-color:var(--gold); background:#3a3420; }
  .menuList { display:flex; flex-direction:column; gap:8px; padding:6px 0 4px; }
  .menuList .btn { text-align:left; font-size:16px; padding:13px 16px; }
  .card2 { background:#232d3a; border-radius:14px; padding:12px; margin:8px 0; display:flex; gap:12px; align-items:center; }
  .card2 .big { font-size:30px; width:44px; text-align:center; flex:none; }
  .card2 .info { flex:1; min-width:0; }
  .card2 .info b { font-size:15px; }
  .card2 .info p { margin:3px 0 0; font-size:12.5px; color:var(--dim); line-height:1.35; }
  .pips { display:flex; gap:3px; margin-top:5px; flex-wrap:wrap; }
  .pips i { width:9px; height:9px; border-radius:2px; background:#0c1016; }
  .pips i.on { background:#ffb800; }
  .card2 .btn { font-size:13px; padding:9px 10px; flex:none; max-width:130px; }
  .prog { height:8px; background:#0c1016; border-radius:4px; overflow:hidden; margin-top:6px; }
  .prog i { display:block; height:100%; background:var(--green); }
  #prevWrap { position:relative; flex:none; background:radial-gradient(ellipse at 50% 85%, #3b4a5e, #1d2530 70%); border-bottom:1px solid var(--line); }
  #prevSlot { height:270px; } #prevSlot canvas { display:block; width:100%; height:270px; touch-action:none; }
  .chip img { width:84px; height:64px; }
  #prevBtns { position:absolute; left:8px; right:8px; bottom:8px; display:flex; justify-content:space-between; pointer-events:none; }
  #prevBtns > * { pointer-events:auto; }
  #prevBtns .hb { width:40px; height:40px; font-size:18px; }
  .nameIn { background:#2a3442; border:2px solid #3a4656; color:#fff; border-radius:10px; padding:8px 10px; font-size:15px; font-weight:800; width:100%; }
  .p { font-size:14.5px; line-height:1.5; color:#dde; }
  .p ul { padding-left:20px; margin:6px 0; }

  #title { position:fixed; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px;
    background:radial-gradient(ellipse at 50% 30%, rgba(20,30,45,.25), rgba(8,12,20,.85)); }
  #logo { font-size:44px; font-weight:1000; text-align:center; line-height:1; color:var(--gold);
    text-shadow:0 4px 0 #a86a00, 0 8px 18px rgba(0,0,0,.6); letter-spacing:1px; transform:rotate(-3deg); }
  #logo small { display:block; font-size:16px; color:#fff; text-shadow:0 2px 0 #000; letter-spacing:4px; margin-top:8px; }
  #titleBtns { display:flex; flex-direction:column; gap:9px; width:min(320px, 90vw); margin-top:18px; }
  #titleBtns .btn { font-size:18px; padding:14px; }
  #ver { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 8px); font-size:11px; color:#889; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="tl">
    <div id="cashBox">
      <div id="cash">$0</div>
      <div id="ips">+$0/s</div>
      <div id="lvlRow"><span id="lvlTxt">Nv 1</span><div id="lvlBar"><div id="lvlFill"></div></div></div>
      <div id="tok"></div>
    </div>
    <div id="miss"><div id="missHead"><span>📜 Misiones</span><span id="missTog">▾</span></div><div id="missList"></div></div>
  </div>
  <div id="tr">
    <button class="hb" data-open="pause" aria-label="Menú">⏸</button>
    <button class="hb" data-open="char" aria-label="Personaje">👗</button>
    <button class="hb" data-open="shop" aria-label="Tienda">🛒</button>
    <button class="hb" id="decorBtn" aria-label="Decorar">🛋️</button>
    <button class="hb" data-open="perks" aria-label="Mejoras">⭐</button>
    <button class="hb" data-open="facs" aria-label="Fábricas">🏭</button>
  </div>
  <div id="br">
    <div id="brCol">
      <button class="hb" id="zIn" aria-label="Acercar">＋</button>
      <button class="hb" id="zOut" aria-label="Alejar">－</button>
      <button class="hb" id="camRot" aria-label="Girar cámara">🔄</button>
      <button class="hb" id="recenter" aria-label="Centrar cámara">🎯</button>
    </div>
    <button id="dash" aria-label="Impulso">⚡<div class="cd" id="dashCd"></div><small>IMPULSO</small></button>
  </div>
  <div id="banner" class="hidden"></div>
</div>
<div id="decorBar" class="hidden">
  <button class="hb" id="dInv" aria-label="Inventario">📦</button>
  <button class="hb" id="dRot" aria-label="Girar">⟳</button>
  <button class="hb" id="dCol" aria-label="Color">🎨</button>
  <button class="hb danger" id="dDel" aria-label="Guardar en el inventario">🗑</button>
  <span class="lbl" id="dLbl">Toca un mueble y arrástralo</span>
  <button class="hb ok" id="dDone" aria-label="Listo">✔</button>
</div>

<div id="title" class="hidden">
  <div id="logo">FÁBRICA<br>TYCOON<small>CONSTRUYE · MEJORA · DOMINA</small></div>
  <div id="titleBtns"></div>
  <div id="ver">v4.3</div>
</div>

<div id="panel" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<div id="modal" class="overlay hidden" style="z-index:20"><div class="sheet" style="max-width:430px"><div class="body" style="padding-top:16px" id="modalBody"></div>
  <div style="display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap" id="modalBtns"></div></div></div>
<div id="toast"></div>

<script src="vendor/three.min.js"></script>
<script>
'use strict';
// =====================================================================
// Utilidades
// =====================================================================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td'];
function fmt(n) {
  if (!isFinite(n)) return '$∞';
  const neg = n < 0; n = Math.abs(n);
  let i = 0;
  while (n >= 999.5 && i < SUF.length - 1) { n /= 1000; i++; }
  if (n >= 999.5) return (neg ? '-$' : '$') + n.toExponential(2);
  const s = i === 0 ? Math.floor(n).toString() : (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2));
  return (neg ? '-$' : '$') + s + SUF[i];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function darken(hex, f) {
  if (hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => clamp(Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f), 0, 255);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

// =====================================================================
// Mundo (coordenadas del suelo; la cámara inclinada aplasta el eje y por K)
// =====================================================================
const W = 1000, H = 2020;
const WALL_Y = 70, WALL_H = 130;
const LANE_Y = [270, 530, 790];
const LANE_INT = [1.0, 1.2, 1.5];
const DX = [125, 215, 305, 395];
const UX = [505, 610, 715];
const CONV_X0 = 60, CONV_X1 = 800, FURN_X = 872, BELT_H = 12;
const PAD = 60, PAD_DY = 100;
const MACH_Y = 1015, MACH_PAD_Y = 1115;
const MACH_X = [130, 315, 500, 685, 870];
const UTIL_Y = 1295;
const COLLECT = { x: 100, y: UTIL_Y, size: 86 };
const CASINO = { x: 245, y: UTIL_Y, size: PAD };
const CHEST = { x: 380, y: UTIL_Y, size: PAD };
const NEXTFAC = { x: 765, y: UTIL_Y, size: PAD };
const REBIRTH = { x: 895, y: UTIL_Y, size: 66 };
const STATUE = { x: 575, y: 1392 };
const STATUE_PAD = { x: 575, y: 1470 };
const LOUNGE = { x0: 40, y0: 1528, x1: 960, y1: 1878 };
const KIOSK_Y = 1945;
const KIOSKS = [
  { id: 'char', x: 130, name: 'Vestidor', icon: '👗', col: '#e94fd0' },
  { id: 'shop', x: 315, name: 'Tienda', icon: '🛒', col: '#2f9bd6' },
  { id: 'decor', x: 500, name: 'Decorar', icon: '🛋️', col: '#2fae7a' },
  { id: 'perks', x: 685, name: 'Mejoras', icon: '⭐', col: '#e6a700' },
  { id: 'facs', x: 870, name: 'Fábricas', icon: '🏭', col: '#5a6cff' },
];
const SPAWN = { x: 500, y: 1590 };

const FACS = [
  { name: 'Taller de Bronce', icon: '🔩', grass: ['#3f7d3a', '#468a40'], sky: ['#8fd0ff', '#d9f0ff'], ores: ['#c98a4b', '#c0c6cf', '#ffd84a'], shape: 'cube', lvl: 1, deco: 'tree' },
  { name: 'Planta de Cristal', icon: '💎', grass: ['#2f6f73', '#357c80'], sky: ['#7fe0ff', '#e0fbff'], ores: ['#8fd3ff', '#4ee39a', '#ff5d7a'], shape: 'gem', lvl: 6, deco: 'crystal' },
  { name: 'Refinería Volcánica', icon: '🌋', grass: ['#4a2a22', '#55302a'], sky: ['#ff8a4a', '#ffd0a0'], ores: ['#a07a62', '#5a4a7a', '#ff6a1a'], shape: 'rock', lvl: 11, deco: 'rock' },
  { name: 'Laboratorio Neón', icon: '🧪', grass: ['#1d1638', '#241b45'], sky: ['#3a1a6a', '#ff3df0'], ores: ['#39ff88', '#ff3df0', '#3dd7ff'], shape: 'orb', lvl: 16, deco: 'glow' },
  { name: 'Fábrica Galáctica', icon: '🚀', grass: ['#0b0f24', '#10153a'], sky: ['#050816', '#3a2a7a'], ores: ['#9a8cff', '#fff27a', '#ff9ad6'], shape: 'star', lvl: 21, deco: 'star' },
];
const FAC_K = f => Math.pow(1e5, f);
const FAC_PRICE = f => f === 0 ? 0 : 2e8 * Math.pow(1e5, f - 1);
const LANE_BASE = [
  { conv: 0, vals: [1, 3, 6, 12], prices: [10, 40, 120, 350], ups: [800, 1500, 2500] },
  { conv: 4000, vals: [60, 120, 220, 400], prices: [6000, 14000, 30000, 60000], ups: [1.2e5, 2e5, 3e5] },
  { conv: 6e5, vals: [2000, 4000, 8000, 15000], prices: [8e5, 2e6, 5e6, 1.2e7], ups: [2.5e7, 4e7, 6e7] },
];
const UP_KIND = [
  { name: 'Escáner láser ×2', mult: 2, icon: '🔦', col: '#38e8ff' },
  { name: 'Duplicador', mult: 1.3, icon: '⧉', col: '#5dff7a', dup: 0.3 },
  { name: 'Prensa hidráulica ×3', mult: 3, icon: '🔨', col: '#ff4fd8' },
];
const DROP_NAMES = ['Dispensador', 'Dispensador+', 'Megadispensador', 'Ultradispensador'];
// máquinas independientes: suben de nivel y producen solas
const MACH = [
  { id: 'mina', name: 'Mina automática', icon: '⛏️', base: 4, cost: 600, req: 'd0_1' },
  { id: 'imprenta', name: 'Imprenta de billetes', icon: '💵', base: 120, cost: 2.5e4, req: 'd0_3' },
  { id: 'servidores', name: 'Granja de servidores', icon: '🖥️', base: 4000, cost: 9e5, req: 'd1_1' },
  { id: 'solar', name: 'Planta solar', icon: '☀️', base: 1.2e5, cost: 3e7, req: 'd2_0' },
  { id: 'robot', name: 'Brazo robótico', icon: '🦾', base: 3e6, cost: 1e9, req: 'd2_3' },
];
const MACH_MAX = 10;
const machIncome = (m, l, f) => l <= 0 ? 0 : m.base * FAC_K(f) * l * Math.pow(1.5, l - 1);
const machCost = (m, l, f) => m.cost * FAC_K(f) * Math.pow(2.6, l);

const ITEMS = [], IBY = [];
for (let f = 0; f < FACS.length; f++) {
  const Kf = FAC_K(f), L = [], by = {};
  const add = o => { o.f = f; L.push(o); by[o.id] = o; };
  LANE_BASE.forEach((B, li) => {
    const y = LANE_Y[li];
    if (li > 0) add({ id: 'conv' + li, type: 'conv', lane: li, name: 'Cinta ' + (li + 1), price: B.conv * Kf, req: `d${li - 1}_3`, px: FURN_X, py: y + PAD_DY, icon: '➡️' });
    B.vals.forEach((v, k) => add({ id: `d${li}_${k}`, type: 'dropper', lane: li, k, name: DROP_NAMES[k], price: B.prices[k] * Kf, val: v * Kf,
      req: k === 0 ? (li === 0 ? null : 'conv' + li) : `d${li}_${k - 1}`, x: DX[k], px: DX[k], py: y + PAD_DY, icon: '⬇️' }));

function sanitize(s) {

  if (s.style && s.style.cinta && !s.belt) { const m = { roja: [15, 0], cromada: [10, 9], oro: [13, 2], arcoiris: [12, 9] }[s.style.cinta]; if (m) { o.belt.c = m[0]; o.belt.r = m[1]; } if (s.style.cinta === 'arcoiris') o.belt.pat = 'arcoiris'; }

  o.inv = s.inv || {}; o.furnBought = s.furnBought || {};
  // versión 2: las decoraciones de emoji pasan a ser muebles colocados en la zona de descanso
  if (Array.isArray(s.decos) && s.decos.length && !s.furn) {

  if (d.pat) { const [k, v] = d.pat.split(':'); S.look[k] = +v; sfx.click(); renderPanel(); return; }
  if (d.outfit !== undefined) { applyOutfit(+d.outfit); sfx.buy(); renderPanel(); return; }
  if (d.shop) return buyShop(...d.shop.split(':'));
  if (d.furn) return buyFurn(d.furn);
  if (d.place) return placeFurn(d.place);
  if (d.perk) return buyPerk(d.perk);
  if (d.travel) return travel(+d.travel);
  if (d.buyfac) { const f = +d.buyfac; if (S.cash >= FAC_PRICE(f)) buyFactory(f); return; }
  if (d.opt) { const [k, v] = d.opt.split(':'); OPT[k] = v === 'true' ? true : v === 'false' ? false : v; saveMeta(); if (k === 'quality') { bgDirty = true; wallDirty = true; } sfx.click(); renderPanel(); return; }
});
$('sheet').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.look) { S.look[t.dataset.look] = t.value / 100; const s = $('sv_' + t.dataset.look); if (s) s.textContent = t.value; }
  if (t.dataset.optr) { OPT[t.dataset.optr] = t.value / 100; t.nextElementSibling.textContent = t.value; saveMeta(); }
  if (t.id === 'nameIn') S.name = t.value.slice(0, 14) || 'Jefa';
});
function keepLookOwned() { ['top', 'bottom', 'shoes', 'acc'].forEach(cat => { const it = CLOTHES[cat].find(i => i.id === S.look[cat]); if (it && !clothOwned(cat, it)) S.look[cat] = CLOTHES[cat][0].id; }); }
function buyCloth(cat, id) {
  const it = CLOTHES[cat].find(i => i.id === id); if (!it) return;
  if (!clothOwned(cat, it)) {
    if (S.level < it.lvl) { sfx.no(); toast(`🔒 Se desbloquea en el nivel ${it.lvl}`); return; }
    if (S.cash < it.price) { sfx.no(); toast(`Te faltan ${fmt(it.price - S.cash)}`); return; }
    S.cash -= it.price; S.owned[cat + ':' + id] = 1; sfx.buy(); addXP(5); mission('style'); toast(`¡${it.name} comprado!`);
  } else sfx.click();
  S.look[cat] = id; renderPanel();
}
function buyShop(cat, id) {
  const list = { suelo: FLOORS, pared: WALLS, cinta: BELTPAT, horno: FURNACES }[cat], it = list.find(i => i.id === id); if (!it) return;
  if (!shopOwned(cat, it)) {
    if (S.level < it.lvl) { sfx.no(); toast(`🔒 Nivel ${it.lvl}`); return; }
    if (S.cash < it.price) { sfx.no(); toast(`Te faltan ${fmt(it.price - S.cash)}`); return; }
    S.cash -= it.price; S.owned['shop:' + cat + ':' + id] = 1; sfx.buy(); addXP(6); mission('style'); toast(`¡${it.name} comprado!`);
  } else sfx.click();
  if (cat === 'suelo') S.style[floorZone] = id;
  else if (cat === 'cinta') S.belt.pat = id;
  else S.style[cat] = id;
  bgDirty = true; wallDirty = true; renderPanel();
}
function buyFurn(id) {
  const D = FURN[id], pr = furnPrice(id);
  if (S.level < D.lvl) { sfx.no(); toast(`🔒 Nivel ${D.lvl}`); return; }
  if (S.cash < pr) { sfx.no(); toast(`Te faltan ${fmt(pr - S.cash)}`); return; }
  S.cash -= pr; S.furnBought[id] = (S.furnBought[id] || 0) + 1; S.inv[id] = (S.inv[id] || 0) + 1;
  sfx.buy(); addXP(6); mission('style');
  modal(`<h2 style="margin:0 0 6px;color:#ffd84a">🛋️ ¡${D.name} comprado!</h2><p class="p">¿Lo colocas ahora? Podrás arrastrarlo, girarlo ⟳ y cambiarle el color 🎨.</p>`,
    [{ label: 'Seguir comprando', cls: 'ghost', fn: renderPanel }, { label: 'Colocar ahora', cls: 'ok', fn: () => placeFurn(id) }]);
}
function buyPerk(id) {
  const p = PERKS.find(x => x.id === id), l = perk(id);
  if (l >= p.max || S.level < p.req(l) || S.cash < p.cost(l)) { sfx.no(); return; }
  S.cash -= p.cost(l); S.perks[id] = l + 1; sfx.buy(); vib(30); addXP(8); mission('perk');
  toast(`${p.icon} ${p.name} → nivel ${l + 1}`);
  if (id === 'trab') syncWorkers();
  renderPanel();
}
function panelAct(a) {
  sfx.click();
  if (a === 'close') { closePanel(); return; }
  if (a === 'save') { save(); toast('💾 Partida guardada'); return; }
  if (a === 'help') { showHelp(); return; }
  if (a === 'decor') { startDecor(); return; }
  if (a === 'title') { save(); closePanel(); showTitle(); return; }
  if (a === 'exit') { exitGame(); return; }
  if (a === 'rotL' || a === 'rotR') { prevState.angT += (a === 'rotR' ? 1 : -1) * Math.PI / 4; return; }
  if (a === 'randOutfit') { randomOutfit(); renderPanel(); return; }
  if (a === 'walk') { prevState.moving = !prevState.moving; return; }
  if (a === 'randBody') { BODY_SLIDERS.forEach(([k]) => S.look[k] = Math.random()); S.look.skin = Math.floor(rnd(0, SKINS.length)); renderPanel(); return; }
  if (a === 'resetBody') { const d = defLook(S.look.gender); BODY_SLIDERS.forEach(([k]) => S.look[k] = d[k]); renderPanel(); return; }
  if (a === 'rerollMiss') { S.missions = []; ensureMissions(); renderPanel(); return; }
  if (a === 'wipe') {
    modal('<h2 style="margin:0;color:#ffd84a">¿Borrar esta partida?</h2><p class="p">Se pierde todo lo de esta ranura.</p>', [{ label: 'Cancelar', cls: 'ghost' }, { label: 'Borrar', cls: 'danger', fn: () => {
      try { localStorage.removeItem(SLOT_KEY(OPT.slot)); } catch (e) { } closePanel(); S = freshState(); showTitle(); toast('Partida borrada');
    } }]);
  }
}
// =====================================================================
// Pantalla de título y ranuras
// =====================================================================
function slotSummary(n) {
  const s = readSlot(n); if (!s) return null;
  const f = (s.fac || []).reduce((a, x, i) => x && x.bought ? i : a, 0);
  return `${esc(s.name || 'Jefa')} · Nv ${s.level || 1} · ${fmt(s.cash || 0)} · ${FACS[f].icon} ${new Date(s.savedAt || Date.now()).toLocaleDateString('es-ES')}`;
}
function showTitle(view) {
  mode = 'title'; panel = null; $('panel').classList.add('hidden'); if (decor.on) endDecor();
  $('hud').classList.add('hidden'); $('title').classList.remove('hidden'); hideBanner();
  const el = $('titleBtns'), has = !!readSlot(OPT.slot);
  if (view === 'new' || view === 'load') {
    el.innerHTML = `<div style="text-align:center;font-weight:900;color:#ffd84a">${view === 'new' ? 'Elige una ranura para la partida nueva' : 'Elige la partida'}</div>` +
      [1, 2, 3].map(n => { const sm = slotSummary(n); return `<button class="btn ${sm ? '' : 'ghost'}" data-slot="${n}" data-view="${view}" ${view === 'load' && !sm ? 'disabled' : ''} style="text-align:left">💾 Ranura ${n}<br><small style="font-weight:700;opacity:.85">${sm || 'Vacía'}</small></button>`; }).join('') +
      '<button class="btn ghost" data-t="back">← Volver</button>';
  } else {
    el.innerHTML = (has ? `<button class="btn ok" data-t="continue">▶ Continuar<br><small style="font-weight:700;opacity:.85">${slotSummary(OPT.slot)}</small></button>` : '') +
      `<button class="btn ${has ? '' : 'ok'}" data-t="new">✨ Nueva partida</button>` +
      `<button class="btn ghost" data-t="load">📂 Cargar partida</button>` +
      `<button class="btn ghost" data-t="opts">⚙️ Opciones</button>` +
      `<button class="btn ghost" data-t="help">❓ Cómo jugar</button>` +
      `<button class="btn danger" data-t="exit">🚪 Salir</button>`;
  }
}
$('titleBtns').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ac(); sfx.click();
  const t = b.dataset.t;
  if (t === 'continue') return startGame(OPT.slot, false);
  if (t === 'new') return showTitle('new');
  if (t === 'load') return showTitle('load');
  if (t === 'back') return showTitle();
  if (t === 'opts') { openPanel('opts'); return; }
  if (t === 'help') return showHelp();
  if (t === 'exit') return exitGame();
  if (b.dataset.slot) {
    const n = +b.dataset.slot;
    if (b.dataset.view === 'load') return startGame(n, false);
    if (readSlot(n)) modal(`<h2 style="margin:0;color:#ffd84a">¿Sobrescribir la ranura ${n}?</h2><p class="p">Se perderá la partida guardada ahí.</p>`, [{ label: 'Cancelar', cls: 'ghost' }, { label: 'Sobrescribir', cls: 'danger', fn: () => startGame(n, true) }]);
    else startGame(n, true);
  }
});
function startGame(n, fresh) {
  OPT.slot = n; saveMeta();
  const s = fresh ? null : readSlot(n);
  S = s ? sanitize(s) : freshState();
  ensureMissions();
  mode = 'play'; $('title').classList.add('hidden'); $('hud').classList.remove('hidden');
  resetWorld(); camOff.x = camOff.y = 0; camSnap();
  if (fresh || !S.seenHelp) {
    S.seenHelp = true; save();
    modal(`<h2 style="margin:0 0 6px;color:#ffd84a">👋 ¡Bienvenida a tu fábrica!</h2><p class="p">Primero, crea tu personaje: elige mujer u hombre, ajusta el físico con las barras y vístete. Luego construye tu imperio.</p>`,
      [{ label: '👗 Crear personaje', cls: 'pink', fn: () => openPanel('char') }, { label: '❓ Cómo jugar', cls: 'ghost', fn: showHelp }]);
  } else offlineGain();
}
function exitGame() {
  save();
  if (window.AndroidApp && window.AndroidApp.exit) { window.AndroidApp.exit(); return; }
  if (mode === 'play') { closePanel(); showTitle(); toast('Partida guardada. ¡Hasta luego!'); }
  else toast('Cierra la pestaña para salir. ¡Tu partida está guardada!');
}
function offlineGain() {
  const el = Math.min((Date.now() - (S.savedAt || Date.now())) / 1000, (4 + perk('offline')) * 3600);
  if (el < 30) return;
  const rate = 0.5 + 0.1 * perk('offline'), gain = totalIncome() * el * rate;
  if (gain < 1) return;
  S.cash += gain; S.stats.earned += gain; save();
  const h = Math.floor(el / 3600), m = Math.floor(el / 60) % 60;
  modal(`<h2 style="margin:0 0 6px;color:#ffd84a">💤 ¡Bienvenida de vuelta!</h2><p class="p">Has estado fuera <b>${h ? h + 'h ' : ''}${m}m</b>. Tus fábricas han ganado <b style="color:#ffd84a">${fmt(gain)}</b> (al ${Math.round(rate * 100)} %).</p>`, [{ label: '¡Genial!', cls: 'ok' }]);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else if (mode === 'play') { offlineGain(); last = performance.now(); }
});
addEventListener('pagehide', save);

// =====================================================================
// Bucle principal
// =====================================================================
let last = performance.now(), saveT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; T += dt;
  if (mode === 'play') {
    update(dt);
    saveT += dt; if (saveT > 10 && OPT.autosave) { saveT = 0; save(); }
  }
  musicTick();
  draw(); hud(dt); drawPreview(dt);
  if (panel && mode === 'play') { const m = $('sheet').querySelector('.money'); if (m) m.textContent = fmt(S.cash) + ' · Nv ' + S.level; }
  requestAnimationFrame(loop);
}
</script>
<script src="draw2d.js"></script>
<script src="char3d.js"></script>
<script src="world3d.js"></script>
<script>
'use strict';
loadMeta(); migrateV1();
S = readSlot(OPT.slot) ? sanitize(readSlot(OPT.slot)) : freshState();
init3D();
resize();
showTitle();
requestAnimationFrame(loop);
</script>
