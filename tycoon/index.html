<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a1b">
<title>Fábrica Tycoon</title>
<style>
  :root { --bg:#2f5d2f; --panel:rgba(15,20,25,.82); --text:#fff; --gold:#ffd84a; --green:#3ddc5c; --red:#ff5a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 0; pointer-events:none; gap:8px; }
  #cashBox { background:var(--panel); border-radius:14px; padding:8px 14px; min-width:150px; box-shadow:0 3px 0 rgba(0,0,0,.3); }
  #cash { font-size:26px; font-weight:800; color:var(--gold); letter-spacing:.5px; text-shadow:0 2px 0 rgba(0,0,0,.4); }
  #ips { font-size:13px; color:#9f9; font-weight:600; }
  #mult { font-size:12px; color:#f9c; font-weight:700; }
  #btns { display:flex; gap:6px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end; max-width:200px; }
  #btns button { width:42px; height:42px; border-radius:12px; border:none; background:var(--panel); color:#fff;
    font-size:20px; font-weight:800; box-shadow:0 3px 0 rgba(0,0,0,.3); }
  #btns button:active { transform:translateY(2px); box-shadow:none; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%);
    background:var(--panel); padding:10px 16px; border-radius:12px; font-weight:700; opacity:0; transition:opacity .3s;
    pointer-events:none; text-align:center; max-width:90vw; }
  #toast.show { opacity:1; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:5; }
  #modal.hidden { display:none; }
  .card { background:#1d2530; border-radius:18px; padding:20px; max-width:420px; width:100%; max-height:85vh; overflow:auto;
    box-shadow:0 6px 0 rgba(0,0,0,.4); border:2px solid #34404f; }
  .card h2 { margin:0 0 10px; font-size:22px; color:var(--gold); }
  .card p, .card li { line-height:1.45; font-size:15px; color:#dde; }
  .card ul { padding-left:20px; margin:8px 0; }
  .card .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #2c3644; font-size:15px; }
  .card .row b { color:var(--gold); }
  .mbtns { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .mbtns button { flex:1; min-width:110px; padding:12px; border:none; border-radius:12px; font-size:16px; font-weight:800;
    color:#fff; background:#3a7bd5; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .mbtns button.ok { background:#2fae4a; }
  .mbtns button.danger { background:#d13b3b; }
  .mbtns button.ghost { background:#3a4656; }
  .mbtns button:active { transform:translateY(2px); box-shadow:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="cashBox"><div id="cash">$0</div><div id="ips">+$0/s</div><div id="mult"></div></div>
  <div id="btns">
    <button id="zoomOut" aria-label="Alejar">−</button>
    <button id="zoomIn" aria-label="Acercar">+</button>
    <button id="snd" aria-label="Sonido">🔊</button>
    <button id="menuBtn" aria-label="Menú">☰</button>
  </div>
</div>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="card"><div id="modalBody"></div><div class="mbtns" id="modalBtns"></div></div></div>

<script>
'use strict';
// ---------- Mundo ----------
const W = 720, H = 1300;
const LANES = [
  { y: 180, interval: 1.0, ore: '#c98a4b', name: 'Bronce' },
  { y: 430, interval: 1.2, ore: '#8fd3ff', name: 'Diamante' },
  { y: 680, interval: 1.5, ore: '#ffd84a', name: 'Oro' },
];
const DX = [110, 190, 270, 350];       // x de los dispensadores
const UX = [440, 510];                 // x de los mejoradores
const CONV_X0 = 50, CONV_X1 = 570, FURN_X = 612;
const PAD = 56;
const UTIL_Y = 905;

const ITEMS = [];
const byId = {};
function add(o) { ITEMS.push(o); byId[o.id] = o; return o; }

// Línea 1 (la cinta 1 viene de serie)
const LANE_DEF = [
  { conv: 0, convReq: null, vals: [1, 3, 6, 12], prices: [10, 40, 120, 350], ups: [2, 2], upPrices: [800, 2500] },
  { conv: 4000, convReq: 'd0_3', vals: [60, 120, 220, 400], prices: [6000, 14000, 30000, 60000], ups: [2, 3], upPrices: [120000, 300000] },
  { conv: 600000, convReq: 'd1_3', vals: [2000, 4000, 8000, 15000], prices: [8e5, 2e6, 5e6, 1.2e7], ups: [2, 3], upPrices: [2.5e7, 6e7] },
];
const DROPPER_NAMES = ['Dispensador', 'Dispensador+', 'Megadispensador', 'Ultradispensador'];
LANE_DEF.forEach((L, li) => {
  const y = LANES[li].y;
  if (li > 0) add({ id: 'conv' + li, type: 'conv', lane: li, name: 'Cinta ' + (li + 1), price: L.conv, req: L.convReq, px: 640, py: y + 72 });
  L.vals.forEach((v, k) => add({
    id: `d${li}_${k}`, type: 'dropper', lane: li, k, name: DROPPER_NAMES[k], price: L.prices[k], val: v,
    req: k === 0 ? (li === 0 ? null : 'conv' + li) : `d${li}_${k - 1}`, x: DX[k], px: DX[k], py: y + 72,
  }));
  L.ups.forEach((m, k) => add({
    id: `u${li}_${k}`, type: 'upgrader', lane: li, k, name: 'Mejorador ×' + m, price: L.upPrices[k], mult: m,
    req: k === 0 ? `d${li}_1` : `u${li}_0`, x: UX[k], px: UX[k], py: y + 72,
  }));
});
add({ id: 'auto', type: 'auto', name: 'Auto-cobro', price: 1500, req: 'd0_2', px: 215, py: UTIL_Y });
add({ id: 'spd1', type: 'speed', name: 'Zapatillas', price: 250, req: 'd0_1', px: 315, py: UTIL_Y });
add({ id: 'spd2', type: 'speed', name: 'Patines', price: 25000, req: 'conv1', px: 415, py: UTIL_Y });
add({ id: 'turbo', type: 'turbo', name: 'Turbo', price: 50000, req: 'd1_1', px: 515, py: UTIL_Y });
add({ id: 'statue', type: 'statue', name: 'Estatua de Oro', price: 1.5e8, req: 'u2_1', px: 360, py: 1150 });

const COLLECT = { x: 100, y: UTIL_Y, size: 84 };
const CASINO = { x: 625, y: UTIL_Y, size: PAD, req: 'd0_3' };
const REBIRTH = { x: 585, y: 1150, size: 70 };
const SPAWN = { x: 360, y: 1240 };

// ---------- Estado ----------
const SAVE_KEY = 'fabrica-tycoon-v1';
let S = freshState();
function freshState(keep) {
  return {
    cash: 25, bank: 0, owned: { conv0: true }, rebirths: keep ? keep.rebirths : 0,
    totalEarned: keep ? keep.totalEarned : 0, playTime: keep ? keep.playTime : 0,
    sound: keep ? keep.sound : true, zoom: keep ? keep.zoom : 1, savedAt: Date.now(), seenHelp: keep ? true : false,
  };
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) S = Object.assign(freshState(), JSON.parse(raw));
  } catch (e) { /* sin guardado */ }
}
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ }
}
const owned = id => !!S.owned[id];
const globalMult = () => 1 + S.rebirths;
const turbo = () => owned('turbo') ? 1.5 : 1;
const convSpeed = () => 75 * turbo();
function laneUpMult(li) { let m = 1; LANE_DEF[li].ups.forEach((u, k) => { if (owned(`u${li}_${k}`)) m *= u; }); return m; }
function incomePerSec() {
  let t = 0;
  ITEMS.forEach(it => { if (it.type === 'dropper' && owned(it.id)) t += it.val / LANES[it.lane].interval * laneUpMult(it.lane); });
  return t * turbo() * globalMult();
}

// ---------- Utilidades ----------
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc'];
function fmt(n) {
  if (!isFinite(n)) return '$∞';
  const neg = n < 0; n = Math.abs(n);
  let i = 0;
  while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; }
  const s = i === 0 ? Math.floor(n).toString() : (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2));
  return (neg ? '-$' : '$') + s + SUF[i];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- Sonido ----------
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type = 'square', vol = 0.06, delay = 0, slide = 0) {
  if (!S.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  buy() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.05, i * 0.06)); },
  coin() { tone(988, 0.06, 'square', 0.05); tone(1319, 0.18, 'square', 0.05, 0.06); },
  no() { tone(160, 0.2, 'sawtooth', 0.05); },
  bag() { [1200, 1500, 1800].forEach((f, i) => tone(f, 0.08, 'triangle', 0.06, i * 0.05)); },
  spin() { for (let i = 0; i < 10; i++) tone(400 + i * 40, 0.05, 'square', 0.03, i * 0.11); },
  win() { [523, 659, 784, 1046, 1319].forEach((f, i) => tone(f, 0.15, 'triangle', 0.07, i * 0.08)); },
  lose() { tone(300, 0.4, 'sawtooth', 0.05, 0, 0.4); },
  rebirth() { for (let i = 0; i < 12; i++) tone(300 + i * 90, 0.15, 'triangle', 0.05, i * 0.07); },
};
function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } }

// ---------- UI ----------
const $ = id => document.getElementById(id);
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
let modalOpen = false;
function modal(html, buttons = [{ label: 'OK', cls: 'ok' }]) {
  $('modalBody').innerHTML = html;
  const box = $('modalBtns'); box.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button'); el.textContent = b.label; el.className = b.cls || '';
    el.onclick = () => { closeModal(); b.fn && b.fn(); };
    box.appendChild(el);
  });
  $('modal').classList.remove('hidden'); modalOpen = true;
}
function closeModal() { $('modal').classList.add('hidden'); modalOpen = false; }
function showHelp() {
  modal(`<h2>🏭 Fábrica Tycoon</h2>
  <ul>
    <li><b>Muévete</b> arrastrando el dedo (joystick) o <b>toca</b> un sitio para ir andando.</li>
    <li><b>Pisa los botones</b> para comprar: verde = puedes pagarlo, rojo = te falta dinero.</li>
    <li>Los <b>dispensadores</b> sueltan bloques en la cinta; los <b>mejoradores</b> multiplican su valor y el <b>horno</b> los convierte en dinero.</li>
    <li>El dinero se acumula en el <b>banco</b>: pisa <b>COBRAR</b> para recogerlo (o compra el cobro automático).</li>
    <li>Coge las <b>bolsas de dinero</b> 💰 que aparecen y prueba suerte en la <b>ruleta</b> 🎰.</li>
    <li>Compra la <b>Estatua de Oro</b> para <b>renacer</b>: empiezas de cero pero ganas más rápido.</li>
    <li>La fábrica sigue ganando (al 50 %) mientras no juegas.</li>
  </ul>`, [{ label: '¡A jugar!', cls: 'ok' }]);
}
function showMenu() {
  const done = ITEMS.filter(i => owned(i.id)).length;
  modal(`<h2>☰ Menú</h2>
    <div class="row"><span>Dinero ganado (total)</span><b>${fmt(S.totalEarned)}</b></div>
    <div class="row"><span>Ingresos</span><b>${fmt(incomePerSec())}/s</b></div>
    <div class="row"><span>Renacimientos</span><b>${S.rebirths} (×${globalMult()})</b></div>
    <div class="row"><span>Mejoras compradas</span><b>${done}/${ITEMS.length + 1}</b></div>
    <div class="row"><span>Tiempo jugado</span><b>${Math.floor(S.playTime / 3600)}h ${Math.floor(S.playTime / 60) % 60}m</b></div>`,
    [{ label: 'Cómo jugar', cls: 'ghost', fn: showHelp },
     { label: 'Borrar partida', cls: 'danger', fn: () => modal('<h2>¿Borrar todo?</h2><p>Perderás la fábrica, el dinero y los renacimientos.</p>',
        [{ label: 'Cancelar', cls: 'ghost' }, { label: 'Borrar', cls: 'danger', fn: () => { S = freshState(); S.seenHelp = true; resetWorld(); save(); toast('Partida nueva'); } }]) },
     { label: 'Seguir', cls: 'ok' }]);
}
$('menuBtn').onclick = () => { ac(); showMenu(); };
$('snd').onclick = () => { S.sound = !S.sound; $('snd').textContent = S.sound ? '🔊' : '🔇'; save(); };
$('zoomIn').onclick = () => { S.zoom = clamp(S.zoom * 1.15, 0.6, 2); save(); };
$('zoomOut').onclick = () => { S.zoom = clamp(S.zoom / 1.15, 0.6, 2); save(); };

// ---------- Entidades ----------
const P = { x: SPAWN.x, y: SPAWN.y, dir: 0, walk: 0, moving: false, target: null };
let ores = [], floats = [], parts = [], bags = [];
let dropTimers = {}, bagTimer = 15, casino = { cd: 0, spin: 0, stake: 0 }, inside = {};
let depositAcc = [0, 0, 0], depositTimer = [0, 0, 0], collectSfxT = 0;
function resetWorld() {
  ores = []; floats = []; parts = []; bags = []; dropTimers = {}; inside = {};
  P.x = SPAWN.x; P.y = SPAWN.y; P.target = null;
}
function float(x, y, text, color = '#fff', size = 18) { floats.push({ x, y, text, color, size, t: 0, life: 1.4 }); }
function burst(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), s = rnd(60, 220); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.4, 0.9), color }); }
}
function earn(v, toBank, x, y) {
  S.totalEarned += v;
  if (toBank) S.bank += v; else S.cash += v;
}

// ---------- Pads ----------
function visibleItems() { return ITEMS.filter(it => !owned(it.id) && (!it.req || owned(it.req))); }
function onPad(px, py, size) { const h = size / 2 + 6; return Math.abs(P.x - px) < h && Math.abs(P.y - py) < h; }
function tryBuy(it) {
  if (S.cash >= it.price) {
    S.cash -= it.price; S.owned[it.id] = true;
    sfx.buy(); vib(35);
    float(it.px, it.py - 40, '¡' + it.name + '!', '#7fff8a', 20);
    burst(it.px, it.py, '#7fff8a', 24);
    if (it.type === 'statue') {
      burst(360, 1050, '#ffd84a', 60);
      setTimeout(() => modal(`<h2>🏆 ¡Fábrica completada!</h2><p>Has construido la fábrica entera. Ahora puedes <b>renacer</b> en el botón morado: empiezas de cero pero todo lo que ganes se multiplica <b>×${globalMult() + 1}</b>.</p>`), 600);
    }
    if (it.id === 'auto') toast('El banco se cobra solo 💸');
    save();
  } else {
    sfx.no(); vib(15);
    float(it.px, it.py - 40, 'Te faltan ' + fmt(it.price - S.cash), '#ff7070', 16);
  }
}
function doCasino() {
  if (casino.spin > 0) return;
  if (casino.cd > 0) { float(CASINO.x, CASINO.y - 40, `Espera ${Math.ceil(casino.cd)}s`, '#ffb', 16); sfx.no(); return; }
  const stake = Math.floor(S.cash * 0.2);
  if (stake < 10) { float(CASINO.x, CASINO.y - 40, 'Necesitas $50', '#ff7070', 16); sfx.no(); return; }
  S.cash -= stake; casino.stake = stake; casino.spin = 1.3; sfx.spin();
  float(CASINO.x, CASINO.y - 40, 'Apuestas ' + fmt(stake), '#ffd84a', 16);
}
function finishCasino() {
  const r = Math.random();
  const m = r < 0.5 ? 0 : r < 0.8 ? 2 : r < 0.95 ? 3 : 5;
  casino.cd = 30;
  if (m === 0) { sfx.lose(); float(CASINO.x, CASINO.y - 50, '¡Perdiste!', '#ff7070', 22); vib(60); }
  else {
    const win = casino.stake * m; S.cash += win; sfx.win(); vib([30, 40, 30]);
    float(CASINO.x, CASINO.y - 50, `×${m}  +${fmt(win)}`, m >= 5 ? '#ff6bff' : '#7fff8a', m >= 5 ? 28 : 22);
    burst(CASINO.x, CASINO.y, m >= 5 ? '#ff6bff' : '#ffd84a', 20 + m * 6);
  }
  save();
}
function doRebirth() {
  modal(`<h2>✨ Renacer</h2><p>Perderás el dinero y todas las máquinas, pero desde ahora todo lo que ganes valdrá <b>×${globalMult() + 1}</b> (ahora ×${globalMult()}).</p>`,
    [{ label: 'Todavía no', cls: 'ghost' }, { label: 'Renacer', cls: 'ok', fn: () => {
      const keep = { rebirths: S.rebirths + 1, totalEarned: S.totalEarned, playTime: S.playTime, sound: S.sound, zoom: S.zoom };
      S = freshState(keep); resetWorld(); save(); sfx.rebirth(); vib(120);
      burst(P.x, P.y, '#ff6bff', 80); toast(`¡Renacido! Multiplicador ×${globalMult()}`);
    } }]);
}
function updatePads() {
  const check = (key, px, py, size, enter, stay) => {
    const now = onPad(px, py, size);
    if (now && !inside[key]) enter && enter();
    if (now) stay && stay();
    inside[key] = now;
  };
  visibleItems().forEach(it => check(it.id, it.px, it.py, it.type === 'statue' ? 70 : PAD, () => tryBuy(it)));
  check('collect', COLLECT.x, COLLECT.y, COLLECT.size, null, () => {
    if (S.bank >= 1) {
      const v = S.bank; S.cash += v; S.bank = 0;
      if (collectSfxT <= 0) { sfx.coin(); vib(20); collectSfxT = 0.3; float(COLLECT.x, COLLECT.y - 55, '+' + fmt(v), '#ffd84a', 22); burst(COLLECT.x, COLLECT.y, '#ffd84a', 10); }
    }
  });
  if (owned(CASINO.req)) check('casino', CASINO.x, CASINO.y, CASINO.size, doCasino);
  if (owned('statue')) check('rebirth', REBIRTH.x, REBIRTH.y, REBIRTH.size, doRebirth);
}

// ---------- Entrada ----------
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; ac(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const joy = { id: null, sx: 0, sy: 0, x: 0, y: 0, active: false, t: 0 };
const cv = $('c'), ctx = cv.getContext('2d');
cv.addEventListener('pointerdown', e => {
  ac(); if (joy.id !== null) return;
  joy.id = e.pointerId; joy.sx = joy.x = e.clientX; joy.sy = joy.y = e.clientY; joy.active = false; joy.t = performance.now();
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  joy.x = e.clientX; joy.y = e.clientY;
  if (!joy.active && Math.hypot(joy.x - joy.sx, joy.y - joy.sy) > 12) { joy.active = true; P.target = null; }
});
function endPointer(e) {
  if (e.pointerId !== joy.id) return;
  if (!joy.active && performance.now() - joy.t < 400) { const w = screenToWorld(e.clientX, e.clientY); P.target = { x: clamp(w.x, 20, W - 20), y: clamp(w.y, 20, H - 20) }; }
  joy.id = null; joy.active = false;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

// ---------- Cámara ----------
let cssW = 0, cssH = 0, dpr = 1, cam = { x: SPAWN.x, y: SPAWN.y, s: 1 };
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cssW = innerWidth; cssH = innerHeight;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
}
addEventListener('resize', resize);
function camScale() { return clamp(cssW / 620, 0.5, 1.6) * S.zoom; }
function screenToWorld(sx, sy) { return { x: (sx - cssW / 2) / cam.s + cam.x, y: (sy - cssH / 2) / cam.s + cam.y }; }

// ---------- Actualización ----------
function update(dt) {
  S.playTime += dt;
  collectSfxT -= dt;
  // movimiento
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (mx || my) P.target = null;
  if (joy.active) { const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.hypot(dx, dy); const k = Math.min(d, 60) / 60 / (d || 1); mx = dx * k; my = dy * k; }
  if (!mx && !my && P.target) {
    const dx = P.target.x - P.x, dy = P.target.y - P.y, d = Math.hypot(dx, dy);
    if (d < 4) P.target = null; else { mx = dx / d; my = dy / d; }
  }
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  const speed = 175 * (1 + (owned('spd1') ? 0.4 : 0) + (owned('spd2') ? 0.5 : 0));
  P.moving = ml > 0.05;
  if (P.moving) {
    P.x = clamp(P.x + mx * speed * dt, 16, W - 16); P.y = clamp(P.y + my * speed * dt, 16, H - 16);
    P.dir = Math.atan2(my, mx); P.walk += dt * 12;
  }
  updatePads();

  // dispensadores
  const auto = owned('auto');
  ITEMS.forEach(it => {
    if (it.type !== 'dropper' || !owned(it.id)) return;
    dropTimers[it.id] = (dropTimers[it.id] || rnd(0, 0.5)) - dt * turbo();
    if (dropTimers[it.id] <= 0) {
      dropTimers[it.id] += LANES[it.lane].interval;
      ores.push({ lane: it.lane, x: it.x, v: it.val, lvl: 0, passed: 0, t: 0, k: it.k });
    }
  });
  // bloques en la cinta
  const cs = convSpeed();
  for (let i = ores.length - 1; i >= 0; i--) {
    const o = ores[i]; o.t += dt;
    if (o.t > 0.25) o.x += cs * dt;
    LANE_DEF[o.lane].ups.forEach((m, k) => {
      if (!(o.passed & (1 << k)) && o.x >= UX[k]) {
        o.passed |= 1 << k;
        if (owned(`u${o.lane}_${k}`)) { o.v *= m; o.lvl++; }
      }
    });
    if (o.x >= CONV_X1) {
      const v = o.v * globalMult();
      earn(v, !auto); depositAcc[o.lane] += v;
      ores.splice(i, 1);
    }
  }
  // texto flotante agrupado sobre cada horno
  for (let l = 0; l < 3; l++) {
    depositTimer[l] -= dt;
    if (depositAcc[l] > 0 && depositTimer[l] <= 0) {
      float(FURN_X, LANES[l].y - 30, '+' + fmt(depositAcc[l]), '#ffd84a', 15);
      depositAcc[l] = 0; depositTimer[l] = 0.7;
    }
  }
  // bolsas de dinero
  bagTimer -= dt;
  if (bagTimer <= 0 && bags.length < 2) {
    bagTimer = rnd(20, 35);
    const spots = [[rnd(60, 660), rnd(330, 360)], [rnd(60, 660), rnd(985, 1060)], [rnd(80, 640), rnd(1190, 1270)]];
    if (owned('conv1')) spots.push([rnd(60, 660), rnd(580, 610)]);
    const sp = spots[Math.floor(Math.random() * spots.length)];
    bags.push({ x: sp[0], y: sp[1], v: Math.max(20, incomePerSec() * 20), t: 0 });
  }
  for (let i = bags.length - 1; i >= 0; i--) {
    const b = bags[i]; b.t += dt;
    if (Math.hypot(P.x - b.x, P.y - b.y) < 30) {
      S.cash += b.v; S.totalEarned += b.v; sfx.bag(); vib(25);
      float(b.x, b.y - 30, '💰 +' + fmt(b.v), '#7fff8a', 22); burst(b.x, b.y, '#7fff8a', 20);
      bags.splice(i, 1);
    } else if (b.t > 25) bags.splice(i, 1);
  }
  // ruleta
  if (casino.cd > 0) casino.cd -= dt;
  if (casino.spin > 0) { casino.spin -= dt; if (casino.spin <= 0) finishCasino(); }
  // efectos
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; f.y -= 40 * dt; if (f.t > f.life) floats.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; if (p.t > p.life) parts.splice(i, 1); }
}

// ---------- Dibujo ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function box(x, y, w, h, d, top, side) {
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x + 4, y + 6, w, h, 6); ctx.fill();
  ctx.fillStyle = side; rr(x, y, w, h, 6); ctx.fill();
  ctx.fillStyle = top; rr(x, y, w, h - d, 6); ctx.fill();
}
function text(t, x, y, size, color = '#fff', align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineJoin = 'round';
  ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}
const TREES = [];
for (let i = 0; i < 26; i++) { const side = i % 2; TREES.push({ x: side ? rnd(-40, -10) : rnd(W + 10, W + 40), y: rnd(0, H), r: rnd(18, 30) }); }
let T = 0;
function drawGround() {
  ctx.fillStyle = '#3f7d3a'; ctx.fillRect(-400, -400, W + 800, H + 800);
  ctx.fillStyle = '#468a40';
  for (let y = -400; y < H + 400; y += 80) for (let x = -400 + ((y / 80) % 2 ? 40 : 0); x < W + 400; x += 80) ctx.fillRect(x, y, 40, 40);
  // parcela
  ctx.fillStyle = '#9aa3ad'; rr(0, 0, W, H, 18); ctx.fill();
  ctx.fillStyle = '#b5bdc6'; rr(8, 8, W - 16, H - 16, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.05)'; ctx.lineWidth = 2;
  for (let x = 8; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x, H - 8); ctx.stroke(); }
  for (let y = 8; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(8, y); ctx.lineTo(W - 8, y); ctx.stroke(); }
  TREES.forEach(t => {
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.arc(t.x + 5, t.y + 7, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#2d6b2a'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#3c8a36'; ctx.beginPath(); ctx.arc(t.x - t.r * 0.25, t.y - t.r * 0.25, t.r * 0.6, 0, 7); ctx.fill();
  });
  text('🏭 FÁBRICA TYCOON', W / 2, 40, 26, '#ffd84a');
}
function drawLane(li) {
  const L = LANES[li], y = L.y, have = owned('conv' + li);
  ctx.globalAlpha = have ? 1 : 0.22;
  // cinta
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(CONV_X0 + 4, y - 18 + 6, CONV_X1 - CONV_X0, 36, 6); ctx.fill();
  ctx.fillStyle = '#2b2f36'; rr(CONV_X0, y - 18, CONV_X1 - CONV_X0, 36, 6); ctx.fill();
  if (have) {
    ctx.save(); rr(CONV_X0 + 3, y - 14, CONV_X1 - CONV_X0 - 6, 28, 4); ctx.clip();
    ctx.fillStyle = '#3d434c';
    const off = (T * convSpeed()) % 24;
    for (let x = CONV_X0 - 24 + off; x < CONV_X1; x += 24) ctx.fillRect(x, y - 14, 10, 28);
    ctx.restore();
  }
  ctx.fillStyle = '#5b636e'; ctx.fillRect(CONV_X0, y - 18, CONV_X1 - CONV_X0, 4); ctx.fillRect(CONV_X0, y + 14, CONV_X1 - CONV_X0, 4);
  // horno
  box(FURN_X - 42, y - 44, 84, 88, 14, '#59413a', '#3a2925');
  const fl = 0.6 + 0.4 * Math.sin(T * 10 + li);
  const g = ctx.createRadialGradient(FURN_X, y - 6, 4, FURN_X, y - 6, 34);
  g.addColorStop(0, have ? `rgba(255,240,150,${fl})` : 'rgba(80,80,80,.5)'); g.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = '#1c1210'; rr(FURN_X - 28, y - 30, 56, 46, 8); ctx.fill();
  ctx.fillStyle = g; ctx.fillRect(FURN_X - 34, y - 40, 68, 66);
  text('HORNO', FURN_X, y + 30, 12, '#ffcf9a');
  ctx.globalAlpha = 1;
  // dispensadores
  DX.forEach((x, k) => {
    const it = byId[`d${li}_${k}`]; const own = owned(it.id);
    if (!own) { if (have) { ctx.globalAlpha = 0.18; box(x - 26, y - 78, 52, 54, 12, '#ccc', '#999'); ctx.globalAlpha = 1; } return; }
    const shades = [['#6c7a89', '#4d5966'], ['#4f8fd6', '#346aa6'], ['#a65ad6', '#7c3ca8'], ['#e0533d', '#a83a28']][k];
    const pulse = Math.max(0, 1 - (dropTimers[it.id] || 0) / LANES[li].interval * 4);
    box(x - 26, y - 80, 52, 56, 12, shades[0], shades[1]);
    ctx.fillStyle = '#222'; rr(x - 10, y - 32, 20, 12, 3); ctx.fill();
    ctx.fillStyle = `rgba(255,255,180,${0.3 + pulse * 0.7})`; ctx.beginPath(); ctx.arc(x, y - 62, 6, 0, 7); ctx.fill();
    text(fmt(it.val), x, y - 46, 13, '#fff');
  });
}
function drawUpgraders(li) {
  const y = LANES[li].y;
  UX.forEach((x, k) => {
    const it = byId[`u${li}_${k}`];
    if (!owned(it.id)) return;
    const col = it.mult >= 3 ? '#ff4fd8' : '#38e8ff';
    ctx.fillStyle = '#444b55'; rr(x - 8, y - 34, 16, 10, 3); ctx.fill(); rr(x - 8, y + 24, 16, 10, 3); ctx.fill();
    const a = 0.45 + 0.35 * Math.sin(T * 6 + k);
    ctx.fillStyle = col; ctx.globalAlpha = a; ctx.fillRect(x - 4, y - 26, 8, 52); ctx.globalAlpha = 1;
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(x - 6, y - 28, 12, 56);
    text('×' + it.mult, x, y - 44, 15, col);
  });
}
function drawOres() {
  ores.forEach(o => {
    const y = LANES[o.lane].y, s = 7 + o.k * 1.5 + Math.min(o.lvl, 3) * 1.5;
    const drop = o.t < 0.25 ? (1 - o.t / 0.25) : 0;
    const yy = y - drop * 26;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(o.x - s + 2, y - s + 4, s * 2, s * 2);
    if (o.lvl > 0) { ctx.fillStyle = o.lvl > 1 ? 'rgba(255,79,216,.5)' : 'rgba(56,232,255,.5)'; ctx.fillRect(o.x - s - 3, yy - s - 3, s * 2 + 6, s * 2 + 6); }
    ctx.fillStyle = LANES[o.lane].ore; ctx.fillRect(o.x - s, yy - s, s * 2, s * 2);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(o.x - s, yy - s, s * 2, s * 0.6);
  });
}
function drawPad(x, y, size, color, label, sub, subColor, pressed) {
  const h = size / 2, d = pressed ? 3 : 8;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(x - h + 3, y - h + 6, size, size, 10); ctx.fill();
  ctx.fillStyle = shade(color, -0.35); rr(x - h, y - h, size, size, 10); ctx.fill();
  ctx.fillStyle = color; rr(x - h, y - h + (8 - d), size, size - 8, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rr(x - h + 5, y - h + (8 - d) + 4, size - 10, 8, 4); ctx.fill();
  if (label) text(label, x, y + h + 14, 14, '#fff');
  if (sub) text(sub, x, y + h + 32, 16, subColor || '#ffd84a');
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 + f)); g = Math.round(g * (1 + f)); b = Math.round(b * (1 + f));
  return `rgb(${clamp(r, 0, 255)},${clamp(g, 0, 255)},${clamp(b, 0, 255)})`;
}
const ICON = { dropper: '⬇', upgrader: '✦', conv: '➡', auto: '💸', speed: '👟', turbo: '⚡', statue: '🏆' };
function drawPads() {
  visibleItems().forEach(it => {
    const can = S.cash >= it.price, size = it.type === 'statue' ? 70 : PAD;
    const pulse = can ? 0.5 + 0.5 * Math.sin(T * 5) : 0;
    if (can) { ctx.fillStyle = `rgba(120,255,140,${0.18 + pulse * 0.2})`; rr(it.px - size / 2 - 7, it.py - size / 2 - 7, size + 14, size + 14, 14); ctx.fill(); }
    drawPad(it.px, it.py, size, can ? '#2fbf4a' : '#c84040', it.name, it.price === 0 ? 'GRATIS' : fmt(it.price), can ? '#ffd84a' : '#ffaaaa', inside[it.id]);
    text(ICON[it.type] || '$', it.px, it.py + 2, 22, '#fff');
  });
  // cobrar
  const bankFull = S.bank >= 1;
  drawPad(COLLECT.x, COLLECT.y, COLLECT.size, owned('auto') ? '#4c6ef5' : '#e6a700', 'COBRAR', owned('auto') ? 'Automático' : 'Banco: ' + fmt(S.bank), '#ffe680', inside.collect);
  text(owned('auto') ? '💸' : '💰', COLLECT.x, COLLECT.y + 2, 30, '#fff');
  if (bankFull && !owned('auto')) { const b = Math.sin(T * 6) * 4; text('⬇', COLLECT.x, COLLECT.y - 62 + b, 24, '#ffd84a'); }
  // ruleta
  if (owned(CASINO.req)) {
    const ready = casino.cd <= 0 && casino.spin <= 0;
    drawPad(CASINO.x, CASINO.y, CASINO.size, ready ? '#9b3cf0' : '#5a4a6e', 'Ruleta', ready ? 'Apuesta 20%' : casino.spin > 0 ? '...' : Math.ceil(casino.cd) + 's', '#e6c8ff', inside.casino);
    const sym = ['🍒', '💎', '7️⃣', '⭐', '🔔'];
    text(casino.spin > 0 ? sym[Math.floor(T * 14) % sym.length] : '🎰', CASINO.x, CASINO.y + 2, 24, '#fff');
  }
  // estatua
  const sy = 1045;
  if (owned('statue')) {
    const g = ctx.createRadialGradient(360, sy, 10, 360, sy, 110);
    g.addColorStop(0, `rgba(255,220,80,${0.5 + 0.2 * Math.sin(T * 3)})`); g.addColorStop(1, 'rgba(255,220,80,0)');
    ctx.fillStyle = g; ctx.fillRect(240, sy - 110, 240, 220);
    box(310, sy + 10, 100, 40, 12, '#d9b23c', '#a6852a');
    text('🏆', 360, sy - 20, 70, '#ffd84a');
  } else if (byId.statue.req && owned(byId.statue.req)) {
    ctx.globalAlpha = 0.25; box(310, sy + 10, 100, 40, 12, '#ccc', '#999'); text('🏆', 360, sy - 20, 70); ctx.globalAlpha = 1;
  }
  if (owned('statue')) {
    drawPad(REBIRTH.x, REBIRTH.y, REBIRTH.size, '#d63cf0', 'RENACER', `×${globalMult() + 1}`, '#ffb3ff', inside.rebirth);
    text('✨', REBIRTH.x, REBIRTH.y + 2, 28, '#fff');
  }
}
function drawBags() {
  bags.forEach(b => {
    const bob = Math.sin(b.t * 5) * 4, blink = b.t > 20 && Math.floor(b.t * 6) % 2;
    if (blink) return;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(b.x, b.y + 14, 14, 5, 0, 0, 7); ctx.fill();
    text('💰', b.x, b.y - 4 + bob, 30);
  });
}
function drawPlayer() {
  const bob = P.moving ? Math.abs(Math.sin(P.walk)) * 4 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(P.x, P.y + 14, 16, 6, 0, 0, 7); ctx.fill();
  const y = P.y - bob;
  // pies
  const sw = P.moving ? Math.sin(P.walk) * 5 : 0;
  ctx.fillStyle = '#2b3a67'; ctx.beginPath(); ctx.arc(P.x - 7, P.y + 10 + sw * 0.3, 5, 0, 7); ctx.arc(P.x + 7, P.y + 10 - sw * 0.3, 5, 0, 7); ctx.fill();
  // cuerpo
  ctx.fillStyle = S.rebirths > 0 ? '#e94fd0' : '#f2b233'; ctx.beginPath(); ctx.arc(P.x, y - 4, 15, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
  // cara
  const ex = Math.cos(P.dir) * 4, ey = Math.sin(P.dir) * 3;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(P.x - 5 + ex, y - 7 + ey, 4, 0, 7); ctx.arc(P.x + 5 + ex, y - 7 + ey, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(P.x - 5 + ex * 1.4, y - 7 + ey * 1.4, 2, 0, 7); ctx.arc(P.x + 5 + ex * 1.4, y - 7 + ey * 1.4, 2, 0, 7); ctx.fill();
  // casco
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(P.x, y - 12, 13, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#e0b000'; ctx.fillRect(P.x - 15, y - 13, 30, 4);
  if (P.target) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.target.x, P.target.y, 8 + Math.sin(T * 8) * 2, 0, 7); ctx.stroke(); }
}
function drawGuide() {
  // flecha hacia la compra asequible más cercana (o hacia COBRAR)
  let best = null, bd = 1e9;
  visibleItems().forEach(it => { if (S.cash >= it.price) { const d = Math.hypot(it.px - P.x, it.py - P.y); if (d < bd) { bd = d; best = it; } } });
  let tx, ty;
  if (best) { tx = best.px; ty = best.py; }
  else if (!owned('auto') && S.bank > 0 && visibleItems().some(it => S.cash + S.bank >= it.price)) { tx = COLLECT.x; ty = COLLECT.y; bd = Math.hypot(tx - P.x, ty - P.y); }
  else return;
  if (bd < 70) return;
  const a = Math.atan2(ty - P.y, tx - P.x), r = 34 + Math.sin(T * 6) * 3;
  ctx.save(); ctx.translate(P.x + Math.cos(a) * r, P.y - 4 + Math.sin(a) * r); ctx.rotate(a);
  ctx.fillStyle = '#7fff8a'; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -8); ctx.lineTo(-2, 0); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function draw() {
  cam.s = camScale();
  const vw = cssW / cam.s, vh = cssH / cam.s;
  const tx = vw >= W ? W / 2 : clamp(P.x, vw / 2, W - vw / 2);
  const ty = vh >= H ? H / 2 : clamp(P.y, vh / 2 - 80 / cam.s, H - vh / 2 + 20);
  cam.x += (tx - cam.x) * 0.15; cam.y += (ty - cam.y) * 0.15;
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * (cssW / 2 - cam.x * cam.s), dpr * (cssH / 2 - cam.y * cam.s));
  drawGround();
  for (let l = 0; l < 3; l++) drawLane(l);
  drawOres();
  for (let l = 0; l < 3; l++) drawUpgraders(l);
  drawPads();
  drawBags();
  parts.forEach(p => { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); });
  ctx.globalAlpha = 1;
  drawGuide();
  drawPlayer();
  floats.forEach(f => { ctx.globalAlpha = Math.min(1, (f.life - f.t) * 2); text(f.text, f.x, f.y, f.size, f.color); });
  ctx.globalAlpha = 1;
  // joystick
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (joy.active) {
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 60, 0, 7); ctx.fill();
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.hypot(dx, dy), k = Math.min(d, 60) / (d || 1);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(joy.sx + dx * k, joy.sy + dy * k, 26, 0, 7); ctx.fill();
  }
}
function hud() {
  $('cash').textContent = fmt(S.cash);
  $('ips').textContent = '+' + fmt(incomePerSec()) + '/s' + (!owned('auto') && S.bank >= 1 ? '  ·  banco ' + fmt(S.bank) : '');
  $('mult').textContent = S.rebirths ? `✨ Renacimientos: ${S.rebirths} (×${globalMult()})` : '';
}

// ---------- Ganancias sin conexión ----------
function offlineGain() {
  const el = Math.min((Date.now() - (S.savedAt || Date.now())) / 1000, 4 * 3600);
  if (el < 30) return;
  const gain = incomePerSec() * el * 0.5;
  if (gain < 1) return;
  S.cash += gain; S.totalEarned += gain; save();
  const h = Math.floor(el / 3600), m = Math.floor(el / 60) % 60;
  modal(`<h2>💤 ¡Bienvenido de vuelta!</h2><p>Has estado fuera <b>${h ? h + 'h ' : ''}${m}m</b>. Tu fábrica ha ganado <b style="color:#ffd84a">${fmt(gain)}</b> mientras tanto (al 50 %, máximo 4 h).</p>`, [{ label: '¡Genial!', cls: 'ok' }]);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save(); else { offlineGain(); last = performance.now(); }
});
addEventListener('pagehide', save);

// ---------- Bucle ----------
let last = performance.now(), saveT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; T += dt;
  update(dt);
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
  draw(); hud();
  requestAnimationFrame(loop);
}
load();
resize();
$('snd').textContent = S.sound ? '🔊' : '🔇';
cam.x = P.x; cam.y = P.y;
if (!S.seenHelp) { S.seenHelp = true; showHelp(); } else offlineGain();
requestAnimationFrame(loop);
</script>
